name: Package CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,lambda]' build
      - run: make test lint
      - run: python -m build
      - name: Verify installed wheel and Lambda extra
        if: github.event_name == 'pull_request'
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl boto3
          cd /tmp
          /tmp/wheel-check/bin/python -c 'from neng_middleware.lambda_http import invoke_http; from neng_middleware.postgres import schema_name'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: middleware-package
          path: dist/
