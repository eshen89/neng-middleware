[project]
name = "neng-middleware"
version = "0.2.0"
description = "Shared Supabase-JWT verification + SigV4 signing for the Neng services (neng-agent, neng-user)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.9",   # asymmetric JWKS verification (PyJWKClient); crypto extra = RS256/ES256
]

[project.optional-dependencies]
# SigV4 signing for internal (AWS_IAM Function URL) calls. Only needed by a caller that makes
# internal service-to-service requests; the JWT verify path pulls none of this.
lambda = ["boto3>=1.35"]
sigv4 = [
    "botocore>=1.34",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "botocore>=1.34",
    "boto3>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]  # the broad except in verify_token collapses every failure to one 401 (deliberate)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
